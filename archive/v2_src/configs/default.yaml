ollama:
  base_url: "http://localhost:11434"
  num_ctx: 6144
  keep_alive: "60m"
  request_timeout_s: 180

models:
  preset: "primary" # primary | alt1 | alt2
  primary:
    target: "qwen2.5-coder:7b-instruct"
    hacker: "qwen3:4b"
  alt1:
    target: "qwen2.5-coder:7b-instruct"
    hacker: "llama3.2:3b"
  alt2:
    target: "qwen2.5-coder:3b-instruct"
    hacker: "qwen3:4b"

target:
  model: "qwen2.5-coder:7b-instruct"
  temperature: 0.4
  max_tokens: 1024
  max_steps: 10

hacker:
  model: "qwen3:4b"
  temperature: 0.7
  max_tokens: 350
  max_interventions: 3
  schedule: [2, 4, 6]
  disable_thinking: true

sandbox:
  mode: "restricted_subprocess" # docker | restricted_subprocess
  allow_restricted: true
  timeout_seconds: 10
  docker_image: "python:3.11-slim"
  docker_memory: "256m"
  docker_cpus: 1.0

experiment:
  time_budget_minutes: 135
  base_seed: 20261102
  tasks:
    - "task_001"
    - "task_002"
    - "task_003"
    - "task_004"
    - "task_005"
    - "task_006"
    - "task_007"
    - "task_008"
