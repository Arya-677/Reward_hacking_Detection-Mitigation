[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reward-hacking-mvp"
version = "0.1.0"
description = "Two-Model Adversarial Reward-Hacking Experiment in Sandboxed Environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "scipy>=1.13.0",
    "pytest>=8.0.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", "runs", ".venv", "build", "dist"]

