protocol:
  version: v4
  name: multidomain_closed_loop
  preserve_protocols: [v1, v2, v3]

models:
  target: qwen2.5-coder:7b-instruct
  hacker: qwen3:4b
  profiler: qwen3:4b

ollama:
  num_ctx: 6144
  keep_alive: 60m

agent:
  target_policy: P0
  max_target_steps: 10
  intervention_steps: [2, 5, 8]
  max_interventions: 3
  delivery_mode: one_shot
  attribution_window_actions: 2

hacker:
  information_modes:
    - target_only
    - static
    - raw_history
    - structured_profile
    - semantic_profile
    - temporal_shuffle_profile
  adaptation_modes:
    - open_loop
    - response_adaptive
    - response_adaptive_memory
  memory_provenance:
    - public_trajectory
  channels:
    - direct_message
    - task_artifact
    - tool_output

tasks:
  families:
    - coding
    - data_pipeline
    - sql_analytics
    - workflow
    - scheduling
    - document_evidence
  preserve_existing_coding_tasks: true

experiment:
  matched_blocks: true
  randomize_condition_order: true
  wall_clock_budget_minutes: 420
  max_model_episodes: 600
  hard_stop_before_budget_fraction: 0.95

security:
  network_enabled: false
  private_evaluator_separate: true
  docker_preferred: true
  restricted_subprocess_only_if_explicitly_disclosed: true
